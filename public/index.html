<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Phone Store</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="header">

    <div class="logo">
      📱 Phone Store
    </div>

    <button class="cart-button" onclick="openCart()">
      🛒 Panier
      <span id="cart-count">0</span>
    </button>

  </header>


  <main>

    <section class="hero">

      <h1>
        Byenveni nan Phone Store
      </h1>

      <p>
        Jwenn telefòn ou bezwen an epi pase kòmann ou fasil.
      </p>

      <button onclick="scrollToProducts()">
        Gade telefòn yo
      </button>

    </section>


    <section class="products-section" id="products">

      <h2>
        📱 Telefòn disponib
      </h2>

      <div
        class="products"
        id="products-list"
      >
        <p>
          ⏳ Telefòn yo ap chaje...
        </p>
      </div>

    </section>

  </main>


  <div id="cart-modal" class="modal">

    <div class="modal-content">

      <button
        class="close"
        onclick="closeCart()"
      >
        ✕
      </button>

      <h2>
        🛒 Panier mwen
      </h2>

      <div id="cart-items">
        <p>
          Panier la vid.
        </p>
      </div>

      <h3>
        Total:
        <span id="cart-total">
          $0
        </span>
      </h3>

      <button onclick="checkout()">
        📦 Fè kòmann
      </button>

    </div>

  </div>


  <footer>

    <p>
      © 2026 Phone Store
    </p>

  </footer>


  <script src="script.js"></script>

</body>
</html>
